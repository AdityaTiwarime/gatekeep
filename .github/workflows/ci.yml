name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: vet
        run: go vet ./...
      - name: unit + integration tests (race detector)
        run: go test -race -count=1 ./...
      - name: fuzz the JWT parser
        run: go test ./internal/jwt -run xxx -fuzz FuzzParse -fuzztime 20s
      - name: end-to-end walkthrough with curl
        run: make e2e
      - name: cross-compile + .deb
        run: make cross deb
